<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Tennis Match Predictor data and evaluation pipeline</title>
  <desc id="description">Yearly ATP CSV files are combined, converted into chronological pre-match features, expanded into two perspectives per match, and evaluated with a match-grouped Random Forest split.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#185c54"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#287c71"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #ffffff; }
      .subheading { font: 400 15px Arial, sans-serif; fill: #d9f2ed; }
      .stage { font: 700 18px Arial, sans-serif; fill: #12304a; }
      .file { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #185c54; }
      .body { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .badge { font: 700 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .guard-title { font: 700 15px Arial, sans-serif; fill: #7c2d12; }
      .guard-text { font: 400 13px Arial, sans-serif; fill: #7c2d12; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="18" fill="#f8fafc"/>
  <path d="M18 0 H1182 A18 18 0 0 1 1200 18 V104 H0 V18 A18 18 0 0 1 18 0 Z" fill="url(#header)"/>
  <text x="54" y="46" class="heading">From ATP records to leakage-aware evaluation</text>
  <text x="54" y="76" class="subheading">Every engineered statistic is captured before the corresponding match updates player history.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="146" width="238" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="78" cy="179" r="18" fill="#287c71"/>
    <text x="78" y="179" class="badge">1</text>
    <text x="108" y="185" class="stage">Collect</text>
    <text x="72" y="224" class="file">atp_matches_YEAR.csv</text>
    <text x="72" y="259" class="body">Available yearly files</text>
    <text x="72" y="282" class="body">are loaded and labelled</text>
    <text x="72" y="305" class="body">with their source year.</text>
    <line x1="72" y1="334" x2="262" y2="334" stroke="#e2e8f0"/>
    <text x="72" y="365" class="file">juntar_csv.py</text>
  </g>

  <path d="M302 276 H338" fill="none" stroke="#287c71" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="354" y="146" width="300" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="384" cy="179" r="18" fill="#287c71"/>
    <text x="384" y="179" class="badge">2</text>
    <text x="414" y="185" class="stage">Engineer features</text>
    <text x="378" y="224" class="file">limpieza_datos.py</text>
    <text x="378" y="259" class="body">Chronological pre-match snapshots:</text>
    <text x="392" y="286" class="small">• Elo and head-to-head</text>
    <text x="392" y="309" class="small">• Recent wins and surface win rate</text>
    <text x="392" y="332" class="small">• Average aces, rank, age and hand</text>
    <text x="378" y="369" class="body">Two labelled perspectives share</text>
    <text x="378" y="391" class="body">one match_id.</text>
  </g>

  <path d="M670 276 H706" fill="none" stroke="#287c71" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="722" y="146" width="430" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="752" cy="179" r="18" fill="#287c71"/>
    <text x="752" y="179" class="badge">3</text>
    <text x="782" y="185" class="stage">Train and evaluate</text>
    <text x="746" y="224" class="file">Modelo_Random_Forest.py</text>
    <rect x="746" y="252" width="174" height="70" rx="10" fill="#e8f5f2" stroke="#9fd4ca"/>
    <text x="833" y="278" class="small" text-anchor="middle">Grouped train set</text>
    <text x="833" y="301" class="small" text-anchor="middle">unique match_id groups</text>
    <rect x="954" y="252" width="174" height="70" rx="10" fill="#eef2ff" stroke="#b8c4ee"/>
    <text x="1041" y="278" class="small" text-anchor="middle">Grouped test set</text>
    <text x="1041" y="301" class="small" text-anchor="middle">disjoint match_id groups</text>
    <path d="M929 252 V322" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="746" y="359" class="body">Random Forest baseline</text>
    <text x="746" y="383" class="body">reports held-out accuracy.</text>
  </g>

  <g>
    <rect x="176" y="457" width="848" height="112" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <path d="M211 486 l10 -18 l10 18 z" fill="#c2410c"/>
    <text x="249" y="486" class="guard-title">Leakage controls represented in code and tests</text>
    <text x="211" y="521" class="guard-text">Player histories update only after a match’s features are captured.</text>
    <text x="211" y="546" class="guard-text">GroupShuffleSplit keeps both player perspectives for the same match on one side of the split.</text>
  </g>
</svg>
