name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q Modelo_Random_Forest.py limpieza_datos.py juntar_csv.py tests

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit runtime requirements
        run: pip-audit -r requirements.txt

      - name: Audit complete development environment
        run: pip-audit --local
